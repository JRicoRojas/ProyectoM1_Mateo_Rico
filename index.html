<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;700&family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="script/script.js" defer></script>
</head>
<body>
    <header class="main-header">
        <nav>
            <h1><a href="#">RandomHue</a></h1>
            <span id="favorites-list">Favorites</span>
            <ul class="header-icons">
                <li><button class="buttons" title ="New Palette" id="start"><i class="fa-solid fa-shuffle"></i></button></li>
                <li><div class="dropdown-main" title ="Choose Colors">
                    <span id="icono-paleta"><i class="fa-solid fa-palette"></i></span>
                    <select id="dropdown">
                        <option value=""selected hidden>Colors</option>
                        <option value="6">6</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                    </select>
                </div></li>
                <li><button class="buttons" title ="Color Blind"><i class="fa-solid fa-glasses"></i></button></li>
                <li><button class="buttons" title ="Previous"><i class="fa-solid fa-circle-chevron-left"></i></button></li>
                <li><button class="buttons" title ="Next"><i class="fa-solid fa-circle-chevron-right"></i></button></li>
                <li><button class="buttons" title ="Favorites" id = "favorites"><i class="fa-solid fa-heart"></i></button></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="color">
                <h2>hsl(300, 26%, 71%)</h2>
                <ul>
                    <li><button class="lock" title ="Lock Color"><i class="fa-solid fa-lock"></i></button></li>
                    <li><button class ="heart" title ="Add to favorites"><i class="fa-solid fa-heart"></i></button></li>
                    <li><button class ="Copy" title ="Copy Color"><i class="fa-solid fa-copy"></i></button></li>
                </ul>
                <p class="hex">#c8a2c8</p>
            </div>
            <div class="color">
                <h2>hsl(346, 100%, 91%)</h2>
                <ul>
                    <li><button class="lock" title ="Lock Color"><i class="fa-solid fa-lock"></i></button></li>
                    <li><button class ="heart" title ="Add to favorites"><i class="fa-solid fa-heart"></i></button></li>
                    <li><button class ="Copy" title ="Copy Color"><i class="fa-solid fa-copy"></i></button></li>
                </ul>
                <p class="hex">#ffd1dc</p>
            </div>
            <div class="color">
                <h2>hsl(197, 71%, 73%)</h2>
                <ul>
                    <li><button class="lock" title ="Lock Color"><i class="fa-solid fa-lock"></i></button></li>
                    <li><button class ="heart" title ="Add to favorites"><i class="fa-solid fa-heart"></i></button></li>
                    <li><button class ="Copy" title ="Copy Color"><i class="fa-solid fa-copy"></i></button></li>
                </ul>
                <p class="hex">#87ceeb</p>
            </div>
            <div class="color">
                <h2>hsl(45, 35%, 63%)</h2>
                <ul>
                    <li><button class="lock" title ="Lock Color"><i class="fa-solid fa-lock"></i></button></li>
                    <li><button class ="heart" title ="Add to favorites"><i class="fa-solid fa-heart"></i></button></li>
                    <li><button class ="Copy" title ="Copy Color"><i class="fa-solid fa-copy"></i></button></li>
                </ul>
                <p class="hex">#c2b280</p>
            </div>
            <div class="color">
                <h2>hsl(29, 57%, 46%) </h2>
                <ul>
                    <li><button class="lock" title ="Lock Color"><i class="fa-solid fa-lock"></i></button></li>
                    <li><button class ="heart" title ="Add to favorites"><i class="fa-solid fa-heart"></i></button></li>
                    <li><button class ="Copy" title ="Copy Color"><i class="fa-solid fa-copy"></i></button></li>
                </ul>
                <p class="hex">#b87333</p>
            </div>
            <div class="color">
                <h2>hsl(35, 100%, 64%)</h2>
                <ul>
                    <li><button class="lock" title ="Lock Color"><i class="fa-solid fa-lock"></i></button></li>
                    <li><button class ="heart" title ="Add to favorites"><i class="fa-solid fa-heart"></i></button></li>
                    <li><button class ="Copy" title ="Copy Color"><i class="fa-solid fa-copy"></i></button></li>
                </ul>
                <p class="hex">#ffb347</p>
            </div>
        </section>
    </main>
<div id="toast" class="toast">New Palette</div>
</body>
</html>
